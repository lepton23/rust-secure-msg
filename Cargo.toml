[package]
name = "p2-message"
version = "0.1.0"
edition = "2024"

[build]
rustflag = ["-C", "target-cpu=native"]

[profile.release]
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = "none"
overflow-checks = false
incremental = true

[dependencies]
tokio = { version = "1.51.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.0.0"
tokio-rustls = { version = "0.26.4", features = ["aws-lc-rs"] }
rustls-pemfile = "2.2.0"
x509-parser = { version = "0.18.1", features = ["verify"] }
rcgen = "0.14.7"
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand = "0.10.0"
ml-kem = "0.2.3"
base64 = "0.22.1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
